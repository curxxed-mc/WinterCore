# 🔥 iCore Plugin Configuration - Powered by curxxed.dev 🔥


# Defines the default rank  for new players
default-rank: Default


# Whether to display player ranks in the tab list
show-rank-in-tab: true

# Whether to display player ranks above their head
show-rank-above-head: true

# Permissions settings (optional, depending on your plugin's needs)
permissions:
  Owner:
    permissions: "core.owner"
    inherits: ["Developer", "Admin", "Moderator", "Helper"]
  Developer:
    permissions: "core.developer"
    inherits: ["Admin", "Moderator", "Helper"]
  Admin:
    permissions: "core.admin"
    inherits: ["Moderator", "Helper"]
  Moderator:
    permissions: "core.moderate"
    inherits: ["Helper"]
  Helper:
    permissions: "core.helper"
permissions-subsets:
  "core.owner":
    - "iCore.*"
  "core.developer":
    - "iCore.*"
  "core.admin":
    - "iCore.ban"
    - "iCore.kick"
    - "iCore.mute"
    - "iCore.unmute"
    - "iCore.warn"
    - "iCore.history"
    - "iCore.report"
    - "iCore.vanish"
    - "iCore.staffchat"
    - "iCore.adminchat"
    - "iCore.gamemode"
  core.helper:
    - "iCore.fly"
    - "iCore.feed"
    - "iCore.heal"

# Server message settings (optional)
messages:
  plugin-enabled: "iCore plugin enabled successfully!"
  plugin-disabled: "iCore plugin disabled successfully!"
  no-permission: "&cYou do not have permission to use this command."

# Staff
server-name: "Testing Servers"  # The name of your server
join-message: "&9[S] %player% &bconnected to &e%server-name%"  # Message when player joins
switch-message: "&9[S] %player% &bconnected to &e%server-name% &bfrom &e%previous-server%" # Message when player switches in between servers
quit-message: "&9[S] %player% &bdisconnected from &e%server-name%"  # Message when player quits

StaffVanishMessages:
  vanish: "&9[S] %player% &bhas vanished!"
  unvanish: "&9[S] %player% &bis no longer vanished!"
# Logging settings (optional)
logging:
  enabled: true
  log-file: "logs/icore.log"

#Database
mysql:
  host: "localhost"
  port: "3306"
  database: "icore"
  username: "root"
  password: "password"

Redis:
  host: "127.0.0.1"
  port: 6379
  password: ""

DiscordWebhook:
  url: "https://discord.com/api/webhooks/.../..."
  VanishLogs: true



