tags-menu:
  title: "&8Select a Tag"
  size: 54
  page-size: 45
  selected-status: "&aCurrently selected"
  unselected-status: "&eClick to select this tag"
  tag-item:
    material: NAME_TAG
    name: "{color}{tag_name}"
    lore:
      - "&7Prefix: {color}{tag_prefix}"
      - "&7Weight: &f{tag_weight}"
      - "{selected_status}"
  controls:
    previous:
      slot: 45
      material: ARROW
      name: "&aPrevious Page"
      lore:
        - "&7Go to page {page}."
    info:
      slot: 49
      material: BOOK
      name: "&bPage {page}/{total_pages}"
      lore:
        - "&7Current tag: &f{selected_tag}"
    clear:
      slot: 50
      material: BARRIER
      name: "&cClear Tag"
      lore:
        - "&7Remove your active tag."
    next:
      slot: 53
      material: ARROW
      name: "&aNext Page"
      lore:
        - "&7Go to page {page}."

staff-list-menu:
  title: "&bOnline Staff"
  size: 54
  staff-item:
    material: SKULL_ITEM
    data: 3
    name: "&b{player}"
    lore:
      - "&7Server: &e{server}"
      - "&7Rank: {rank_color}{rank}"
  empty-item:
    enabled: true
    slot: 22
    material: BARRIER
    name: "&cNo staff online"
    lore:
      - "&7No online staff were found across live servers."

rank-menu:
  title: "&8Set rank for {target}"
  duration-title: "&8Set duration for {target}"
  size: 54
  rank-item:
    name: "{rank_color}{rank}"
    lore:
      - "&7&m------------------------"
      - "&6Preview:"
      - "{preview}"
      - "&7&m------------------------"
      - "&aClick to grant this rank to &b{target}&a."
  cancel-button:
    slot: 53
    material: BARRIER
    name: "&cCancel"
    message: "&cRank selection cancelled."
  duration:
    size: 27
    adjustments:
      add-hour:
        slot: 0
        material: WATCH
        name: "&a+1 Hour"
      add-day:
        slot: 1
        material: WATCH
        name: "&a+1 Day"
      add-week:
        slot: 2
        material: WATCH
        name: "&a+1 Week"
      add-month:
        slot: 3
        material: WATCH
        name: "&a+1 Month"
      remove-hour:
        slot: 5
        material: WATCH
        name: "&c-1 Hour"
      remove-day:
        slot: 6
        material: WATCH
        name: "&c-1 Day"
      remove-week:
        slot: 7
        material: WATCH
        name: "&c-1 Week"
      remove-month:
        slot: 8
        material: WATCH
        name: "&c-1 Month"
    permanent-button:
      slot: 13
      material: BEDROCK
      name: "&6Permanent"
    current-duration:
      slot: 22
      material: PAPER
      name: "&bCurrent Duration: {duration}"
    continue-button:
      slot: 26
      material: WOOL
      data: 5
      name: "&aContinue"
    cancel-button:
      slot: 18
      material: BARRIER
      name: "&cCancel"
      message: "&cRank grant cancelled."
  messages:
    reason-prompt: "&ePlease type the reason for granting this rank in chat. Type &ccancel &eto abort."
    cancelled: "&cRank grant cancelled."
    granted: "&aGranted rank &e{rank} &ato &b{target}&a."

disguise-menu:
  title: "&8Select disguise rank"
  size: 36
  rank-item:
    name: "{rank_color}{rank}"
    lore:
      - "&7&m------------------------"
      - "&6Prefix: &f{clean_rank_color}{rank_prefix}"
      - "&7&m------------------------"
      - "&aClick to disguise as &b{target}&a."
  cancel-button:
    slot: 35
    material: BARRIER
    name: "&cCancel"
  messages:
    success: "&aDisguise applied as &e{target} &7with rank &b{rank}&a!"
    error: "&cFailed to apply disguise. Try again later."
    no-rank-found: "&cSelected rank is invalid or not found."
    global-player-found: "&cA player with that name is already online."
    same-name: "&cYou cannot disguise as yourself."
    not-online: "&cYou must be online to disguise."
    unknown: "&cUnknown error occurred."

