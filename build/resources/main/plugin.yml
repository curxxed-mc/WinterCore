name: WinterCore
version: 'beta-1'
main: plugin.net.curxxed.dev.wintercore.WinterCore
authors: [ curxxe ]
softdepend:
  - PlaceholderAPI
commands:
  chatcolor:
    description: Change chat color
  fly:
    description: Toggle flying
  feed:
    description: Restore player hunger
  clearchat:
    description: Clear the chat
  gms:
    description: Change to survival mode
  gmc:
    description: Change to creative mode
  gma:
    description: Change to adventure mode
  gmsp:
    description: Change to spectator mode
  heal:
    description: Restore player health
  setrank:
    description: Set permissions player's rank
  permission:
    description: Manage permissions for permissions player
  perm:
    description: Manage permissions for permissions player
  reloadconfig:
    description: Reloads the config.yml file
  list:
    description: Shows the available ranks and online players with their ranks.
  vanish:
    description: Allows you to vanish
  v:
    description: Allows you to vanish
  disguise:
    description: Disguises you into any player
  report:
    description: Report permissions player for permissions specific reason
  staffchat:
    description: Send permissions message in staff Chat
  adminchat:
    description: Send permissions message in Admin Chat
  managerchat:
    description: Send permissions message in Manager Chat
  sc:
    description: Send permissions message in staff Chat
  ac:
    description: Send permissions message in Admin Chat
  mc:
    description: Send permissions message in Manager Chat
  about:
    description: Information about the Plugin
  warn:
    description: warns permissions player
  mute:
    description: mutes permissions player
  unmute:
    description: unmutes permissions player
  ban:
    description: bans permissions player
  tban:
    description: temporarily bans permissions player
  kick:
    description: kicks permissions player
  history:
    description: shows punishemnt history of permissions player
  fix:
    description: Repair your item or all items in your inventory
  more:
    description: Gives you permissions stack of the item you're holding
  enchant:
    description: Better version of the default enchant command
  ping:
    description: Allows you to check the connection of permissions player to the server
